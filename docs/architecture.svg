<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2e8b57"/>
    </marker>
    <marker id="arrTeal" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#0d8b8b"/>
    </marker>
    <marker id="arrPurple" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7b3fbf"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1360" fill="#f7f8fa"/>
  <text x="850" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">ROS2 Pipeline POC — topology &amp; threads</text>
  <text x="850" y="72" text-anchor="middle" font-size="14" fill="#555">manager (bottom) publishes new_frame → fans out to A (metadata) and B→C (image chain); both return to manager</text>

  <!-- ============================ TOP ROW: A, B, C ============================ -->

  <!-- ===== postprocessA (metadata branch) ===== -->
  <rect x="110" y="90" width="380" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="110" y="90" width="380" height="50" rx="10" fill="#8a5a1a"/>
  <text x="300" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessA</text>
  <text x="300" y="132" text-anchor="middle" font-size="12" fill="#f0dcc0">metadata branch · does NOT stamp the image</text>

  <rect x="122" y="148" width="356" height="120" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="300" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin (executor)</text>
  <text x="134" y="190" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← new_frame</text>
  <text x="146" y="208" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="146" y="226" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg, t_recv))</text>
  <text x="146" y="243" font-size="11.5" fill="#888" font-style="italic" font-family="monospace">returns instantly</text>
  <text x="134" y="261" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M300,268 L300,294" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="206" y="272" width="188" height="22" rx="11" fill="#fff4d6" stroke="#e0a020"/>
  <text x="300" y="288" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="122" y="302" width="356" height="158" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="300" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="134" y="344" font-size="12.5" fill="#222" font-family="monospace">get((msg, t_recv))</text>
  <text x="134" y="362" font-size="12.5" fill="#222" font-family="monospace">msg_to_image()</text>
  <text x="134" y="380" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake work</text>
  <text x="134" y="398" font-size="12.5" fill="#222" font-family="monospace">mean = img.mean()</text>
  <text x="134" y="416" font-size="12.5" fill="#222" font-family="monospace">build Metadata (WxH, mean)</text>
  <text x="134" y="434" font-size="12.5" fill="#0d8b8b" font-family="monospace">publish → metadata_a</text>
  <text x="134" y="452" font-size="11.5" fill="#888" font-style="italic" font-family="monospace">image is never modified</text>

  <!-- ===== postprocessB (image chain) ===== -->
  <rect x="660" y="90" width="380" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="660" y="90" width="380" height="50" rx="10" fill="#2e6e3f"/>
  <text x="850" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessB</text>
  <text x="850" y="132" text-anchor="middle" font-size="12" fill="#cde8d4">image chain · stamps 'postprocessB'</text>

  <rect x="672" y="148" width="356" height="120" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="850" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin (executor)</text>
  <text x="684" y="190" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← new_frame</text>
  <text x="696" y="208" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="696" y="226" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg, t_recv))</text>
  <text x="696" y="243" font-size="11.5" fill="#888" font-style="italic" font-family="monospace">returns instantly</text>
  <text x="684" y="261" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M850,268 L850,294" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="756" y="272" width="188" height="22" rx="11" fill="#fff4d6" stroke="#e0a020"/>
  <text x="850" y="288" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="672" y="302" width="356" height="158" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="850" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="684" y="344" font-size="12.5" fill="#222" font-family="monospace">get((msg, t_recv))</text>
  <text x="684" y="362" font-size="12.5" fill="#222" font-family="monospace">msg_to_image()</text>
  <text x="684" y="380" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake work</text>
  <text x="684" y="398" font-size="12.5" fill="#222" font-family="monospace">stamp 'postprocessB'</text>
  <text x="684" y="416" font-size="12.5" fill="#222" font-family="monospace">image_to_msg()</text>
  <text x="684" y="434" font-size="12.5" fill="#2e8b57" font-family="monospace">publish → out_b   [B]</text>

  <!-- ===== postprocessC (image chain) ===== -->
  <rect x="1210" y="90" width="380" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="1210" y="90" width="380" height="50" rx="10" fill="#2e6e3f"/>
  <text x="1400" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessC</text>
  <text x="1400" y="132" text-anchor="middle" font-size="12" fill="#cde8d4">image chain · stamps 'postprocessC'</text>

  <rect x="1222" y="148" width="356" height="120" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="1400" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin (executor)</text>
  <text x="1234" y="190" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← out_b</text>
  <text x="1246" y="208" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="1246" y="226" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg, t_recv))</text>
  <text x="1246" y="243" font-size="11.5" fill="#888" font-style="italic" font-family="monospace">returns instantly</text>
  <text x="1234" y="261" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M1400,268 L1400,294" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="1306" y="272" width="188" height="22" rx="11" fill="#fff4d6" stroke="#e0a020"/>
  <text x="1400" y="288" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="1222" y="302" width="356" height="158" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="1400" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="1234" y="344" font-size="12.5" fill="#222" font-family="monospace">get((msg, t_recv))</text>
  <text x="1234" y="362" font-size="12.5" fill="#222" font-family="monospace">msg_to_image()</text>
  <text x="1234" y="380" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake work</text>
  <text x="1234" y="398" font-size="12.5" fill="#222" font-family="monospace">stamp 'postprocessC'</text>
  <text x="1234" y="416" font-size="12.5" fill="#222" font-family="monospace">image_to_msg()</text>
  <text x="1234" y="434" font-size="12.5" fill="#2e8b57" font-family="monospace">publish → out_c   [B, C]</text>

  <!-- ============================ out_b: B → C (top row) ============================ -->
  <path d="M1040,270 L1206,270" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="1078" y="238" width="90" height="24" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="1123" y="255" text-anchor="middle" font-size="13" fill="#2e6e3f" font-weight="bold" font-family="monospace">out_b</text>

  <!-- ============================ MANAGER (bottom, wide) ============================ -->
  <rect x="110" y="800" width="1480" height="290" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="110" y="800" width="1480" height="50" rx="10" fill="#1a1a2e"/>
  <text x="850" y="825" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">manager — generator + collector</text>
  <text x="850" y="843" text-anchor="middle" font-size="12" fill="#c9c9e0">MAIN THREAD only — rclpy.spin (single-threaded, no worker)</text>

  <rect x="122" y="858" width="1456" height="220" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <line x1="620" y1="866" x2="620" y2="1070" stroke="#b6cdfb"/>
  <line x1="1092" y1="866" x2="1092" y2="1070" stroke="#b6cdfb"/>

  <!-- manager col 1: source -->
  <text x="140" y="884" font-size="12.5" font-weight="bold" fill="#1a56c4">OUTPUT (source)</text>
  <text x="140" y="908" font-size="12.5" fill="#222" font-family="monospace">send_timer (every 0.5s):</text>
  <text x="152" y="926" font-size="12.5" fill="#2e8b57" font-family="monospace">publish Frame → new_frame</text>
  <text x="140" y="950" font-size="12.5" fill="#222" font-family="monospace">at startup:</text>
  <text x="152" y="968" font-size="12.5" fill="#7b3fbf" font-family="monospace">control_pub → control (RUN)</text>
  <text x="140" y="998" font-size="11.5" fill="#888" font-style="italic">one sample set, one pass</text>

  <!-- manager col 2: image collector -->
  <text x="640" y="884" font-size="12.5" font-weight="bold" fill="#1a56c4">IMAGE COLLECTOR</text>
  <text x="640" y="908" font-size="12.5" fill="#222" font-family="monospace">on_final_frame() ← out_c</text>
  <text x="652" y="926" font-size="12.5" fill="#222" font-family="monospace">verify stamped_by == [B, C]</text>
  <text x="652" y="944" font-size="12.5" fill="#222" font-family="monospace">→ PASS / FAIL</text>
  <text x="652" y="968" font-size="12.5" fill="#222" font-family="monospace">save output_frames/</text>
  <text x="652" y="986" font-size="12.5" fill="#222" font-family="monospace">frame_N_&lt;mode&gt;.png</text>
  <text x="652" y="1010" font-size="12.5" fill="#222" font-family="monospace">log transport_ms / ring_ms</text>

  <!-- manager col 3: metadata collector + done -->
  <text x="1112" y="884" font-size="12.5" font-weight="bold" fill="#1a56c4">METADATA COLLECTOR</text>
  <text x="1112" y="908" font-size="12.5" fill="#222" font-family="monospace">on_metadata() ← metadata_a</text>
  <text x="1124" y="926" font-size="12.5" fill="#222" font-family="monospace">record WxH, mean_brightness</text>
  <text x="1112" y="962" font-size="12.5" fill="#c0392b" font-family="monospace">DONE when BOTH out_c AND</text>
  <text x="1112" y="980" font-size="12.5" fill="#c0392b" font-family="monospace">metadata_a arrive per frame</text>
  <text x="1124" y="1004" font-size="12.5" fill="#222" font-family="monospace">→ print summary table</text>
  <text x="1124" y="1022" font-size="12.5" fill="#7b3fbf" font-family="monospace">control_pub → control (STOP)</text>

  <!-- ============================ VERTICAL CONNECTORS (each on its own track) ============================ -->
  <!-- Column A: new_frame (up), control (up), metadata_a (down) -->
  <path d="M180,800 L180,472" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="135" y="548" width="90" height="24" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="180" y="565" text-anchor="middle" font-size="12.5" fill="#2e6e3f" font-weight="bold" font-family="monospace">new_frame</text>

  <path d="M290,800 L290,472" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <rect x="252" y="628" width="76" height="24" rx="6" fill="#f0e8fb" stroke="#7b3fbf"/>
  <text x="290" y="645" text-anchor="middle" font-size="12.5" fill="#5a2d91" font-weight="bold" font-family="monospace">control</text>

  <path d="M420,470 L420,798" fill="none" stroke="#0d8b8b" stroke-width="3" marker-end="url(#arrTeal)"/>
  <rect x="372" y="708" width="96" height="24" rx="6" fill="#e0f2f2" stroke="#0d8b8b"/>
  <text x="420" y="725" text-anchor="middle" font-size="12.5" fill="#0a6b6b" font-weight="bold" font-family="monospace">metadata_a</text>

  <!-- Column B: new_frame (up), control (up) -->
  <path d="M760,800 L760,472" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="715" y="548" width="90" height="24" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="760" y="565" text-anchor="middle" font-size="12.5" fill="#2e6e3f" font-weight="bold" font-family="monospace">new_frame</text>

  <path d="M940,800 L940,472" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <rect x="902" y="648" width="76" height="24" rx="6" fill="#f0e8fb" stroke="#7b3fbf"/>
  <text x="940" y="665" text-anchor="middle" font-size="12.5" fill="#5a2d91" font-weight="bold" font-family="monospace">control</text>

  <!-- Column C: control (up), out_c (down) -->
  <path d="M1300,800 L1300,472" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <rect x="1262" y="548" width="76" height="24" rx="6" fill="#f0e8fb" stroke="#7b3fbf"/>
  <text x="1300" y="565" text-anchor="middle" font-size="12.5" fill="#5a2d91" font-weight="bold" font-family="monospace">control</text>

  <path d="M1500,470 L1500,798" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="1458" y="648" width="84" height="24" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="1500" y="665" text-anchor="middle" font-size="12.5" fill="#2e6e3f" font-weight="bold" font-family="monospace">out_c</text>

  <!-- ============================ LEGEND (bottom strip) ============================ -->
  <rect x="110" y="1120" width="1480" height="210" rx="10" fill="#ffffff" stroke="#ccc"/>
  <text x="130" y="1150" font-size="17" font-weight="bold" fill="#1a1a2e">Legend</text>
  <line x1="600" y1="1132" x2="600" y2="1318" stroke="#e0e0e0"/>
  <line x1="1080" y1="1132" x2="1080" y2="1318" stroke="#e0e0e0"/>

  <!-- legend col 1: threads -->
  <rect x="130" y="1168" width="24" height="15" rx="3" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="164" y="1180" font-size="13" fill="#222"><tspan font-weight="bold">Main thread</tspan> — rclpy executor, one callback</text>
  <text x="164" y="1198" font-size="13" fill="#222">at a time; on_frame only enqueues (never blocks).</text>
  <rect x="130" y="1214" width="24" height="15" rx="3" fill="#fdecdd" stroke="#e8862e"/>
  <text x="164" y="1226" font-size="13" fill="#222"><tspan font-weight="bold">Worker thread</tspan> — slow fake work + publish;</text>
  <text x="164" y="1244" font-size="13" fill="#222">keeps the executor free.</text>
  <rect x="130" y="1260" width="24" height="15" rx="11" fill="#fff4d6" stroke="#e0a020"/>
  <text x="164" y="1272" font-size="13" fill="#222"><tspan font-weight="bold">queue.Queue</tspan> — hand-off; 0.5s poll timeout so</text>
  <text x="164" y="1290" font-size="13" fill="#222">stop_worker() (Event + join) exits cleanly.</text>

  <!-- legend col 2: arrows -->
  <line x1="620" y1="1176" x2="652" y2="1176" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="662" y="1181" font-size="13" fill="#222"><tspan font-weight="bold">Frame (image)</tspan> — new_frame, out_b, out_c.</text>
  <text x="662" y="1199" font-size="12.5" fill="#555">Frame = Image + stamped_by[] + timestamps.</text>
  <line x1="620" y1="1224" x2="652" y2="1224" stroke="#0d8b8b" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="662" y="1229" font-size="13" fill="#222"><tspan font-weight="bold">Metadata</tspan> — metadata_a (A → manager).</text>
  <text x="662" y="1247" font-size="12.5" fill="#555">Metadata = WxH + mean_brightness. No image.</text>
  <line x1="620" y1="1272" x2="652" y2="1272" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <text x="662" y="1277" font-size="13" fill="#222"><tspan font-weight="bold">Control</tspan> — manager broadcasts mode +</text>
  <text x="662" y="1295" font-size="12.5" fill="#555">RUN/STOP to A, B, C.</text>

  <!-- legend col 3: fan-out + modes -->
  <text x="1100" y="1168" font-size="13" fill="#222"><tspan font-weight="bold">Fan-out:</tspan> new_frame → A (metadata, no stamp)</text>
  <text x="1100" y="1186" font-size="13" fill="#222">AND B → C (image chain). Final out_c carries</text>
  <text x="1100" y="1204" font-size="13" fill="#222">exactly [postprocessB, postprocessC].</text>
  <rect x="1100" y="1218" width="470" height="42" rx="7" fill="#eef6ff" stroke="#4285f4"/>
  <text x="1112" y="1236" font-size="12.5" font-weight="bold" fill="#1a56c4">MODE=copy</text>
  <text x="1112" y="1252" font-size="12" fill="#222">RTPS/UDP — full serialize + copy each hop.</text>
  <rect x="1100" y="1266" width="470" height="42" rx="7" fill="#eefaf0" stroke="#2e8b57"/>
  <text x="1112" y="1284" font-size="12.5" font-weight="bold" fill="#2e6e3f">MODE=zero_copy</text>
  <text x="1112" y="1300" font-size="12" fill="#222">Fast DDS Data-Sharing over shared memory (ipc: shareable).</text>
</svg>
