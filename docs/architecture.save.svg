<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#2e8b57"/>
    </marker>
    <marker id="arrTeal" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#0d8b8b"/>
    </marker>
    <marker id="arrPurple" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#7b3fbf"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1300" fill="#f7f8fa"/>

  <text x="800" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a2e">ROS2 Pipeline POC — fan-out topology, topics &amp; threads</text>
  <text x="800" y="66" text-anchor="middle" font-size="14" fill="#555">new_frame fans out to a metadata branch (A) and an image chain (B→C) · peer-to-peer DDS (Fast DDS) · ROS_DOMAIN_ID=42</text>

  <!-- ============ CONTROL bus (purple dashed) ============ -->
  <path d="M190,420 L190,90 L1520,90" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5"/>
  <path d="M730,90 L730,148" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <path d="M400,90 L400,1010 L558,1010" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <path d="M1520,90 L1520,900 L1352,900" fill="none" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <rect x="470" y="76" width="380" height="24" rx="6" fill="#f0e8fb" stroke="#7b3fbf"/>
  <text x="660" y="93" text-anchor="middle" font-size="13" fill="#5a2d91" font-weight="bold">/pipeline/control  (mode, RUN/STOP) → A, B, C</text>

  <!-- ================= MANAGER ================= -->
  <rect x="40" y="420" width="300" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="40" y="420" width="300" height="50" rx="10" fill="#1a1a2e"/>
  <text x="190" y="444" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">manager</text>
  <text x="190" y="462" text-anchor="middle" font-size="12" fill="#c9c9e0">generator + collector</text>

  <rect x="52" y="478" width="276" height="312" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="190" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin (executor)</text>
  <text x="64" y="522" font-size="12.5" fill="#222" font-family="monospace">send_timer (0.5s):</text>
  <text x="76" y="540" font-size="12.5" fill="#2e8b57" font-family="monospace">publish Frame → new_frame</text>
  <text x="64" y="564" font-size="12.5" fill="#222" font-family="monospace">startup: control_pub → control</text>
  <line x1="64" y1="578" x2="316" y2="578" stroke="#b6cdfb" stroke-dasharray="3,3"/>
  <text x="64" y="600" font-size="12.5" fill="#222" font-family="monospace">on_final_frame() ← out_c</text>
  <text x="76" y="618" font-size="12.5" fill="#222" font-family="monospace">verify stamped_by</text>
  <text x="76" y="636" font-size="12.5" fill="#222" font-family="monospace">== [B, C] → PASS/FAIL</text>
  <text x="76" y="654" font-size="12.5" fill="#222" font-family="monospace">save output_frames/*.png</text>
  <text x="64" y="678" font-size="12.5" fill="#222" font-family="monospace">on_metadata() ← metadata_a</text>
  <text x="76" y="696" font-size="12.5" fill="#222" font-family="monospace">record mean_brightness</text>
  <line x1="64" y1="710" x2="316" y2="710" stroke="#b6cdfb" stroke-dasharray="3,3"/>
  <text x="64" y="732" font-size="12" fill="#8a3ffb" font-family="monospace">done when BOTH out_c +</text>
  <text x="64" y="750" font-size="12" fill="#8a3ffb" font-family="monospace">metadata_a received</text>
  <text x="64" y="774" font-size="11.5" fill="#888" font-style="italic">no worker thread</text>

  <!-- ================= POSTPROCESS A (metadata) ================= -->
  <rect x="560" y="150" width="340" height="330" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="560" y="150" width="340" height="50" rx="10" fill="#8a5a1a"/>
  <text x="730" y="174" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessA</text>
  <text x="730" y="192" text-anchor="middle" font-size="12" fill="#f0dcc0">metadata branch · does NOT stamp</text>

  <rect x="572" y="208" width="316" height="118" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="730" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin</text>
  <text x="584" y="250" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← new_frame</text>
  <text x="596" y="268" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="596" y="286" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg,t_recv))</text>
  <text x="584" y="312" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M730,326 L730,352" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="636" y="330" width="188" height="24" rx="12" fill="#fff4d6" stroke="#e0a020"/>
  <text x="730" y="347" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="572" y="360" width="316" height="112" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="730" y="379" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="584" y="401" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake</text>
  <text x="584" y="419" font-size="12.5" fill="#222" font-family="monospace">mean = img.mean()</text>
  <text x="584" y="437" font-size="12.5" fill="#222" font-family="monospace">build Metadata (WxH, mean)</text>
  <text x="584" y="455" font-size="12.5" fill="#0d8b8b" font-family="monospace">publish → metadata_a</text>

  <!-- ================= POSTPROCESS B (image chain) ================= -->
  <rect x="560" y="820" width="340" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="560" y="820" width="340" height="50" rx="10" fill="#2e6e3f"/>
  <text x="730" y="844" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessB</text>
  <text x="730" y="862" text-anchor="middle" font-size="12" fill="#cde8d4">image chain · stamps 'postprocessB'</text>

  <rect x="572" y="878" width="316" height="122" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="730" y="897" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin</text>
  <text x="584" y="920" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← new_frame</text>
  <text x="596" y="938" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="596" y="956" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg,t_recv))</text>
  <text x="584" y="984" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M730,1000 L730,1026" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="636" y="1004" width="188" height="24" rx="12" fill="#fff4d6" stroke="#e0a020"/>
  <text x="730" y="1021" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="572" y="1034" width="316" height="152" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="730" y="1053" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="584" y="1075" font-size="12.5" fill="#222" font-family="monospace">msg_to_image()</text>
  <text x="584" y="1093" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake</text>
  <text x="584" y="1111" font-size="12.5" fill="#222" font-family="monospace">stamp 'postprocessB'</text>
  <text x="584" y="1129" font-size="12.5" fill="#222" font-family="monospace">image_to_msg()</text>
  <text x="584" y="1147" font-size="12.5" fill="#2e8b57" font-family="monospace">publish → out_b</text>
  <text x="584" y="1167" font-size="12" fill="#222" font-family="monospace">stamped_by=[B]</text>

  <!-- ================= POSTPROCESS C (image chain) ================= -->
  <rect x="1010" y="820" width="340" height="380" rx="10" fill="#ffffff" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="1010" y="820" width="340" height="50" rx="10" fill="#2e6e3f"/>
  <text x="1180" y="844" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">postprocessC</text>
  <text x="1180" y="862" text-anchor="middle" font-size="12" fill="#cde8d4">image chain · stamps 'postprocessC'</text>

  <rect x="1022" y="878" width="316" height="122" rx="7" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="1180" y="897" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a56c4">MAIN THREAD — rclpy.spin</text>
  <text x="1034" y="920" font-size="12.5" fill="#222" font-family="monospace">on_frame() ← out_b</text>
  <text x="1046" y="938" font-size="12.5" fill="#222" font-family="monospace">t_recv = now()</text>
  <text x="1046" y="956" font-size="12.5" fill="#b8531a" font-family="monospace">queue.put((msg,t_recv))</text>
  <text x="1034" y="984" font-size="12.5" fill="#7b3fbf" font-family="monospace">on_control() ← control</text>

  <path d="M1180,1000 L1180,1026" stroke="#e0a020" stroke-width="2.5" marker-end="url(#arrGray)"/>
  <rect x="1086" y="1004" width="188" height="24" rx="12" fill="#fff4d6" stroke="#e0a020"/>
  <text x="1180" y="1021" text-anchor="middle" font-size="11.5" fill="#8a6200" font-family="monospace">queue.Queue</text>

  <rect x="1022" y="1034" width="316" height="152" rx="7" fill="#fdecdd" stroke="#e8862e"/>
  <text x="1180" y="1053" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8531a">WORKER THREAD</text>
  <text x="1034" y="1075" font-size="12.5" fill="#222" font-family="monospace">msg_to_image()</text>
  <text x="1034" y="1093" font-size="12.5" fill="#c0392b" font-family="monospace">sleep(0.1–0.6s) ⏱ fake</text>
  <text x="1034" y="1111" font-size="12.5" fill="#222" font-family="monospace">stamp 'postprocessC'</text>
  <text x="1034" y="1129" font-size="12.5" fill="#222" font-family="monospace">image_to_msg()</text>
  <text x="1034" y="1147" font-size="12.5" fill="#2e8b57" font-family="monospace">publish → out_c</text>
  <text x="1034" y="1167" font-size="12" fill="#222" font-family="monospace">stamped_by=[B, C]</text>

  <!-- ============ DATA ARROWS ============ -->
  <!-- new_frame: manager fans out to A and B (green) -->
  <path d="M340,520 L490,520" fill="none" stroke="#2e8b57" stroke-width="3"/>
  <circle cx="490" cy="520" r="4" fill="#2e8b57"/>
  <path d="M490,520 L490,290 L558,290" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <path d="M490,520 L490,960 L558,960" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="380" y="497" width="150" height="22" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="455" y="513" text-anchor="middle" font-size="12" fill="#2e6e3f" font-weight="bold" font-family="monospace">new_frame</text>

  <!-- metadata_a: A back to manager (teal) -->
  <path d="M560,392 L444,392 L444,650 L342,650" fill="none" stroke="#0d8b8b" stroke-width="3" marker-end="url(#arrTeal)"/>
  <rect x="360" y="360" width="140" height="22" rx="6" fill="#e0f2f2" stroke="#0d8b8b"/>
  <text x="430" y="376" text-anchor="middle" font-size="12" fill="#0a6b6b" font-weight="bold" font-family="monospace">metadata_a</text>

  <!-- out_b: B to C (green) -->
  <path d="M900,1010 L1008,1010" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="912" y="975" width="86" height="22" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="955" y="991" text-anchor="middle" font-size="12" fill="#2e6e3f" font-weight="bold" font-family="monospace">out_b</text>

  <!-- out_c: C back to manager (green) -->
  <path d="M1180,1200 L1180,1250 L190,1250 L190,802" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <rect x="640" y="1239" width="90" height="22" rx="6" fill="#e3f3e9" stroke="#2e8b57"/>
  <text x="685" y="1255" text-anchor="middle" font-size="12" fill="#2e6e3f" font-weight="bold" font-family="monospace">out_c</text>

  <!-- ============ LEGEND ============ -->
  <rect x="930" y="150" width="560" height="600" rx="10" fill="#ffffff" stroke="#ccc"/>
  <text x="950" y="180" font-size="17" font-weight="bold" fill="#1a1a2e">Legend</text>

  <rect x="950" y="196" width="24" height="15" rx="3" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="984" y="208" font-size="13" fill="#222"><tspan font-weight="bold">Main thread</tspan> — rclpy executor, one callback at a time.</text>
  <text x="984" y="226" font-size="13" fill="#222">on_frame just captures t_recv and enqueues (never blocks).</text>

  <rect x="950" y="240" width="24" height="15" rx="3" fill="#fdecdd" stroke="#e8862e"/>
  <text x="984" y="252" font-size="13" fill="#222"><tspan font-weight="bold">Worker thread</tspan> — owns the slow fake work (sleep +</text>
  <text x="984" y="270" font-size="13" fill="#222">stamp / compute) and publishes the result.</text>

  <rect x="950" y="284" width="24" height="15" rx="12" fill="#fff4d6" stroke="#e0a020"/>
  <text x="984" y="296" font-size="13" fill="#222"><tspan font-weight="bold">queue.Queue</tspan> — hand-off; worker polls with 0.5s</text>
  <text x="984" y="314" font-size="13" fill="#222">timeout so stop_worker() (Event + join) exits cleanly.</text>

  <line x1="950" y1="342" x2="982" y2="342" stroke="#2e8b57" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="992" y="347" font-size="13" fill="#222"><tspan font-weight="bold">Frame (image)</tspan> — new_frame, out_b, out_c.</text>
  <text x="992" y="365" font-size="12.5" fill="#555">pipeline_interfaces/Frame = Image + stamped_by[] + stamps.</text>

  <line x1="950" y1="386" x2="982" y2="386" stroke="#0d8b8b" stroke-width="3" marker-end="url(#arrTeal)"/>
  <text x="992" y="391" font-size="13" fill="#222"><tspan font-weight="bold">Metadata</tspan> — metadata_a (A → manager).</text>
  <text x="992" y="409" font-size="12.5" fill="#555">pipeline_interfaces/Metadata = WxH + mean_brightness. No image.</text>

  <line x1="950" y1="430" x2="982" y2="430" stroke="#7b3fbf" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrPurple)"/>
  <text x="992" y="435" font-size="13" fill="#222"><tspan font-weight="bold">Control</tspan> — manager broadcasts mode + RUN/STOP.</text>

  <text x="950" y="470" font-size="14" font-weight="bold" fill="#1a1a2e">Fan-out: new_frame → A (metadata) AND B (image chain).</text>
  <text x="950" y="492" font-size="13" fill="#333">A reads the frame but never modifies it; only B and C stamp,</text>
  <text x="950" y="510" font-size="13" fill="#333">so the final out_c image carries exactly [postprocessB, postprocessC].</text>
  <text x="950" y="528" font-size="13" fill="#333">Manager marks a frame done only when out_c AND metadata_a arrive.</text>

  <text x="950" y="560" font-size="14" font-weight="bold" fill="#1a1a2e">Transport (no broker — peer-to-peer DDS):</text>
  <rect x="950" y="574" width="510" height="52" rx="8" fill="#eef6ff" stroke="#4285f4"/>
  <text x="964" y="594" font-size="13" font-weight="bold" fill="#1a56c4">MODE=copy (data_sharing OFF)</text>
  <text x="964" y="614" font-size="12.5" fill="#222">RTPS over UDP — full serialize + copy at every hop.</text>
  <rect x="950" y="634" width="510" height="52" rx="8" fill="#eefaf0" stroke="#2e8b57"/>
  <text x="964" y="654" font-size="13" font-weight="bold" fill="#2e6e3f">MODE=zero_copy (data_sharing AUTOMATIC)</text>
  <text x="964" y="674" font-size="12.5" fill="#222">Fast DDS Data-Sharing over shared memory (ipc: shareable).</text>

  <text x="950" y="710" font-size="12.5" fill="#555" font-style="italic">All 4 services run the SAME Docker image; they differ only by the</text>
  <text x="950" y="728" font-size="12.5" fill="#555" font-style="italic">compose command: (ros2 run &lt;pkg&gt; &lt;node&gt;) and the MODE env var.</text>
</svg>
