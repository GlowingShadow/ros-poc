# Kept separate from .devcontainer/docker-compose.yml so the existing
# dev-shell devcontainer flow is never affected.
# Bring the pipeline up with:
#   MODE=copy docker compose -f docker-compose.ros2.yml up --build
#   MODE=zero_copy docker compose -f docker-compose.ros2.yml up --build

x-ros2-app: &ros2-app
  build:
    context: .
    dockerfile: docker/ros2-app/Dockerfile
  image: ros2-poc-app:latest
  networks: [ros2net]
  environment: &ros2-app-env
    MODE: ${MODE:-copy}
    FORCE_REBUILD: ${FORCE_REBUILD:-0}
    ROS_DOMAIN_ID: "42"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    # Real video frame rate makes the postprocessB->postprocessC hop-delay
    # simulation (meant for the static 5-image demo) fall further behind
    # every frame; zeroed out so the live stream stays real-time. No longer
    # simulating "real work" per hop, since this is now a live-feed
    # pipeline rather than the original transport-cost demo.
    MIN_PROCESSING_DELAY_S: ${MIN_PROCESSING_DELAY_S:-0.0}
    MAX_PROCESSING_DELAY_S: ${MAX_PROCESSING_DELAY_S:-0.0}
    # Only read by manager; harmless no-ops for postprocessA/B/C.
    VIDEO_PATH: ${VIDEO_PATH:-/workspace/input/video_720p_30fps.mp4}
    GST_UDP_HOST: ${GST_UDP_HOST:-host.docker.internal}
    GST_UDP_PORT: ${GST_UDP_PORT:-5000}
    # Read by both manager (EXPECTED_STAMP_COUNT) and postprocessB (which
    # topic it publishes to) -- set to 0 to bypass postprocessC, with B
    # publishing straight to out_c. Keep these two readers in sync; that's
    # the whole point of sharing one env var instead of two.
    ENABLE_POSTPROCESS_C: ${ENABLE_POSTPROCESS_C:-1}
  volumes:
    - .:/workspace:cached
  restart: "no"

services:
  manager:
    <<: *ros2-app
    ipc: shareable
    command: ["ros2", "run", "manager", "manager_node"]
    # Lets manager reach a gst-launch-1.0 receiver run directly in the
    # devcontainer shell: that shell is the Docker host for the nested
    # dockerd running this stack, i.e. this container's host-gateway.
    # Pinned to the literal IPv4 gateway (see the ros2net ipam config below)
    # rather than the "host-gateway" magic string: on this nested dockerd
    # that string resolves to an IPv6 address with no route on this
    # network, silently black-holing every packet.
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    healthcheck:
      # All four services share the bind-mounted /workspace, and only
      # manager runs colcon build. postprocessA/B/C must wait for this
      # build to finish (not just for the container to start) or they
      # race manager's colcon build and corrupt the shared build/install dirs.
      test: ["CMD-SHELL", "test -f /workspace/ros2_ws/install/setup.bash"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 5s

  postprocessA:
    <<: *ros2-app
    ipc: service:manager
    depends_on:
      manager:
        condition: service_healthy
    command: ["ros2", "run", "postprocess_a", "postprocess_a_node"]

  postprocessB:
    <<: *ros2-app
    ipc: service:manager
    depends_on:
      manager:
        condition: service_healthy
    command: ["ros2", "run", "postprocess_b", "postprocess_b_node"]

  postprocessC:
    <<: *ros2-app
    ipc: service:manager
    depends_on:
      manager:
        condition: service_healthy
    command: ["ros2", "run", "postprocess_c", "postprocess_c_node"]

networks:
  ros2net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
